<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris juarez</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">Tetris juarez</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- [records] panel de records al terminar la partida -->
        <div id="records-gameover" class="records hidden">
          <p id="record-msg" class="record-msg"></p>
          <form id="record-form" class="record-form hidden" autocomplete="off">
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
            <button type="submit" id="record-save">Guardar</button>
          </form>
          <div id="gameover-records"></div>
          <p id="gameover-stats" class="records-stats"></p>
          <button type="button" class="records-reset">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- [records] pantalla de inicio -->
    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box records">
        <p class="start-title">Tetris juarez</p>
        <button type="button" id="start-btn">Jugar</button>
        <p class="label">RECORDS</p>
        <div id="start-records"></div>
        <p id="start-stats" class="records-stats"></p>
        <button type="button" class="records-reset">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
